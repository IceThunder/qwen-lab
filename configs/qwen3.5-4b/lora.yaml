# M4 16 GB conservative text-only QLoRA starting point.
model: models/qwen3.5-4b/weights
train: true
fine_tune_type: lora
data: data/example
seed: 42
num_layers: 2
batch_size: 1
iters: 100
val_batches: 2
learning_rate: 0.00001
steps_per_report: 1
steps_per_eval: 25
save_every: 25
max_seq_length: 256
grad_checkpoint: true
grad_accumulation_steps: 1
mask_prompt: true
adapter_path: adapters/qwen3.5-4b/demo
lora_parameters:
  rank: 4
  scale: 8.0
  dropout: 0.0
  keys:
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
